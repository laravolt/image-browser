on:
  workflow_call:
    inputs:
      tag-prefix:
        required: true
        type: string
        default: "beta-"
      php-variation:
        required: true
        type: string
      checkout-type:
        required: true
        type: string

jobs:
  docker-publish:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
    steps:
      ##
      # Checkout branch (for push deployments)
      ##
      - uses: actions/checkout@v7
        if: inputs.checkout-type  == 'branch'

      ##
      # Checkout latest stable release (for production releases)
      ##
      - name: Get latest stable release
        if: inputs.checkout-type  == 'latest-stable'
        id: latest-stable-version
        run: |
          echo "LATEST_STABLE_VERSION=$(curl --silent --header "Accept: application/vnd.github.v3.sha" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')" >> $GITHUB_OUTPUT

      - name: Confirm release tag
        if: inputs.checkout-type  == 'latest-stable'
        run: |
          echo "Latest Stable Release Tag: ${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}"

      - name: Checkout latest stable tag
        if: inputs.checkout-type  == 'latest-stable'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}

      ##
      # Docker build & publish
      ##
      - name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: "👨‍🔬 Set docker tags: Non-Release "
        if: inputs.checkout-type == 'branch'
        run: echo "DOCKER_TAGS=laravoltdev/image-browser:${{ inputs.tag-prefix}}php${{ matrix.php-version }}-${{ inputs.php-variation }}" >> $GITHUB_ENV

      - name: "🚀 Set docker tags: Release"
        if: inputs.checkout-type == 'latest-stable'
        run: echo "DOCKER_TAGS=laravoltdev/image-browser:${{ inputs.tag-prefix}}php${{ matrix.php-version }}-${{ inputs.php-variation }}, laravoltdev/image-browser:${{ inputs.tag-prefix}}php${{ matrix.php-version }}-${{ inputs.php-variation }}-${{ steps.latest-stable-version.outputs.LATEST_STABLE_VERSION }}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          build-args: PHP_VERSION=${{ matrix.php-version }}
          context: src/.
          platforms: |
            linux/amd64
            linux/arm64/v8
          pull: true
          push: true
          tags: ${{ env.DOCKER_TAGS }}
